title: PHM5001 final project
description: Translation timeline for gene and cell therapies, with the companion registry methods paper
theme: jekyll-theme-primer
markdown: kramdown
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-titles-from-headings
relative_links:
  enabled: true
  collections: false
titles_from_headings:
  enabled: true
  strip_title: true
readme_index:
  enabled: true
  remove_originals: false
exclude:
  - .venv
  - review
  - OPEN_ITEMS.md
  - referee_pitch.md
  - research/README.md
  - research/findings/README.md
  - code/__pycache__
  - "**/__pycache__"
  - Gemfile
  - Gemfile.lock
